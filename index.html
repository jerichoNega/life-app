<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0B0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F0E9" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Life: a city guide that feels like a night out. Photo-led cards, a real map, real weather.
   Dark by default like the best event apps; light follows the system. Each slot owns one colour. */
:root {
  --bg: #0C0B0A; --surface: #171513; --surface-2: #221F1C; --ink: #F5F1EA; --muted: #A39B90; --faint: #6B645B;
  --line: rgba(255,255,255,.08); --glass: rgba(20,18,16,.55);
  --accent: #FF5A36;
  --social: #FF5A36; --out: #A274FF; --food: #FFB224; --learn: #2BD4A4; --trip: #3D9BFF; --stretch: #FF4FA3;
  --good: #2BD4A4;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F4F0E9; --surface: #FFFFFF; --surface-2: #EEE8DF; --ink: #17140F; --muted: #6F665B; --faint: #A69C90;
    --line: rgba(0,0,0,.08); --glass: rgba(255,255,255,.6); color-scheme: light;
  }
}
:root[data-theme="light"] { --bg: #F4F0E9; --surface: #FFFFFF; --surface-2: #EEE8DF; --ink: #17140F; --muted: #6F665B; --faint: #A69C90; --line: rgba(0,0,0,.08); --glass: rgba(255,255,255,.6); color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
body.locked { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: 0; z-index: 30; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 1.45rem/1 var(--f-display); letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); display: inline-block; }
.gen { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: .9rem; transition: transform .2s var(--ease); }
.gen:active { transform: scale(.96); }
.gen:disabled { opacity: .6; cursor: default; }
.gen.busy svg { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px calc(80px + env(safe-area-inset-bottom)); }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; padding: 22px 0 22px; }
.kicker { font-size: .82rem; color: var(--muted); margin: 0 0 8px; font-weight: 500; letter-spacing: .01em; }
h1 { font: 800 clamp(2.3rem, 9vw, 4.2rem)/.98 var(--f-display); letter-spacing: -.035em; margin: 0; }
h1 em { font-style: normal; color: var(--accent); }
.sub { color: var(--muted); margin: 12px 0 0; max-width: 36em; }
.run { font-size: .85rem; color: var(--muted); margin: 8px 0 0; min-height: 1.2em; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font: 800 1.6rem/1 var(--f-display); }
.ring b small { display: block; font: 500 .68rem var(--f-body); color: var(--muted); margin-top: 3px; }

/* ---------- Week strip ---------- */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 4px 0 26px; }
.day { background: var(--surface); border-radius: var(--r-md); padding: 10px 4px 10px; display: grid; justify-items: center; gap: 4px; min-height: 112px;
  transition: background .2s var(--ease), transform .2s var(--ease); position: relative; }
.day:active { transform: scale(.96); }
.day .dn { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.day .dd { font: 700 1.25rem/1 var(--f-display); }
.day .wx { display: flex; flex-direction: column; align-items: center; font-size: .72rem; color: var(--muted); gap: 1px; }
.day .wx svg { width: 20px; height: 20px; }
.day .pips { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 7px; }
.day .pips i { width: 7px; height: 7px; border-radius: 50%; }
.day .pips i.also { background: var(--faint); width: 5px; height: 5px; margin-top: 1px; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.day.sel { background: var(--ink); color: var(--bg); }
.day.sel .dn, .day.sel .wx { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.day.empty { opacity: .55; }

/* ---------- Section heads ---------- */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 40px 0 14px; }
.sec h2 { font: 750 1.55rem/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.sec span, .sec button { color: var(--muted); font-size: .88rem; }
.sec button { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Deck: photo cards ---------- */
.deck { display: grid; grid-auto-flow: column; grid-auto-columns: min(78vw, 320px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; overscroll-behavior-x: contain; }
.deck::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .deck { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); grid-auto-columns: auto; margin: 0; padding: 4px 0; overflow: visible; } }
.card { scroll-snap-align: start; position: relative; aspect-ratio: 4 / 5.2; border-radius: var(--r-lg); overflow: hidden; text-align: left; isolation: isolate;
  background: radial-gradient(120% 80% at 20% 10%, color-mix(in srgb, var(--slot) 70%, #000) 0%, color-mix(in srgb, var(--slot) 25%, #0b0a09) 70%);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.6); transition: transform .35s var(--ease), box-shadow .35s var(--ease), opacity .3s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 28px 50px -24px rgba(0,0,0,.7); }
.card:active { transform: scale(.98); }
.card .glyph { position: absolute; right: -10%; top: 12%; width: 70%; height: auto; color: rgba(255,255,255,.14); z-index: -2; stroke-width: 1.2; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; transition: transform .8s var(--ease), filter .3s; }
.card:hover img { transform: scale(1.04); }
.card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,.15) 50%, rgba(0,0,0,.88) 100%); }
.card .top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; font-size: .74rem; font-weight: 600;
  background: rgba(15,13,11,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--slot); box-shadow: 0 0 10px var(--slot); }
.badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-content: center; background: rgba(15,13,11,.5); backdrop-filter: blur(12px); color: #fff; }
.badge.done { background: var(--good); color: #062018; }
.badge svg { width: 15px; height: 15px; stroke-width: 2.6; }
.card .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; color: #fff; display: grid; gap: 8px; }
.when { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--slot) 55%, #fff); }
.card h3 { margin: 0; font: 750 1.5rem/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.facts-row { display: flex; gap: 6px; flex-wrap: wrap; }
.fact { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 999px; font-size: .76rem; font-weight: 500;
  background: rgba(255,255,255,.14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.fact svg { width: 13px; height: 13px; }
.card.s-done img, .card.s-skipped img { filter: grayscale(.85) brightness(.7); }
.card.s-skipped { opacity: .5; }
.card.dim { opacity: .28; transform: scale(.97); }

/* ---------- Bento ---------- */
.bento { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 900px) { .bento { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface); border-radius: var(--r-md); padding: 16px; display: grid; gap: 10px; align-content: start; min-height: 150px; }
.tile .lbl { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .big { font: 800 2rem/1 var(--f-display); letter-spacing: -.03em; }
.tile .big small { font: 500 .85rem var(--f-body); color: var(--muted); letter-spacing: 0; }
.tile .note { font-size: .8rem; color: var(--muted); }
.meter { display: flex; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; gap: 2px; }
.meter i { display: block; height: 100%; background: var(--slot); }
.modes { display: flex; gap: 8px; flex-wrap: wrap; }
.mode { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 5px 10px; font-size: .8rem; }
.mix { display: flex; gap: 6px; flex-wrap: wrap; }
.mix span { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.mix i { width: 10px; height: 10px; border-radius: 3px; background: var(--slot); }
.mix span.on { color: var(--ink); }
.spark { display: flex; gap: 4px; align-items: end; height: 36px; }
.spark i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--surface-2); min-height: 4px; }
.spark i.on { background: var(--accent); }

/* ---------- Map ---------- */
.map { height: 360px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); position: relative; z-index: 0; }
@media (min-width: 900px) { .map { height: 440px; } }
.leaflet-container { background: var(--surface); font: inherit; }
.pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--slot); display: grid; place-content: center;
  box-shadow: 0 6px 16px -4px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.9); }
.pin b { transform: rotate(45deg); color: #fff; font: 800 .9rem var(--f-display); }
.pin.done { filter: grayscale(.7); }
.pin-also { width: 12px; height: 12px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.pin-you { width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(61,155,255,.5), 0 0 0 10px rgba(61,155,255,.18); }
.leaflet-tooltip { background: var(--surface); color: var(--ink); border: 0; border-radius: 10px; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); font-weight: 600; font-size: .8rem; }
.leaflet-tooltip-top:before { border-top-color: var(--surface); }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }

/* ---------- Also on ---------- */
.also { display: grid; gap: 8px; }
@media (min-width: 900px) { .also { grid-template-columns: 1fr 1fr; } }
.row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r-md); padding: 8px 12px 8px 8px; text-decoration: none; transition: transform .2s var(--ease); }
.row:active { transform: scale(.98); }
.thumb { width: 64px; height: 64px; border-radius: var(--r-sm); background: var(--surface-2) center / cover no-repeat; display: grid; place-content: center; color: var(--faint); }
.row b { display: block; font-weight: 600; line-height: 1.25; }
.row span { display: block; font-size: .82rem; color: var(--muted); margin-top: 2px; }
.dchip { font-size: .72rem; font-weight: 700; text-align: center; line-height: 1.1; background: var(--surface-2); border-radius: 10px; padding: 6px 8px; min-width: 44px; }
.dchip small { display: block; font-weight: 500; color: var(--muted); }

/* ---------- Past weeks ---------- */
.weeks { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.weeks button { scroll-snap-align: start; flex: none; background: var(--surface); border-radius: var(--r-md); padding: 12px 16px; text-align: left; min-height: 56px; }
.weeks button.on { box-shadow: inset 0 0 0 1.5px var(--ink); }
.weeks small { display: block; color: var(--muted); font-size: .8rem; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .3s var(--ease); backdrop-filter: blur(2px); }
.scrim.show { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 28px 28px 0 0; transform: translateY(100%); transition: transform .45s var(--ease); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.sheet.show { transform: none; }
@media (min-width: 760px) { .sheet { left: 50%; right: auto; width: 620px; bottom: 50%; border-radius: 28px; max-height: 88vh; transform: translate(-50%, 60%) scale(.96); opacity: 0; transition: transform .4s var(--ease), opacity .3s; }
  .sheet.show { transform: translate(-50%, 50%); opacity: 1; } }
.sh-img { position: relative; aspect-ratio: 16 / 10; overflow: hidden; isolation: isolate;
  background: radial-gradient(120% 90% at 20% 10%, color-mix(in srgb, var(--slot) 70%, #000), color-mix(in srgb, var(--slot) 20%, #0b0a09) 75%); }
.sh-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
.sh-img .glyph { position: absolute; right: 6%; top: 8%; width: 46%; color: rgba(255,255,255,.16); z-index: -2; stroke-width: 1.2; }
.sh-img::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.3), transparent 35%, transparent 60%, var(--bg)); }
.grab { position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: rgba(255,255,255,.6); }
.x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; background: rgba(15,13,11,.55); backdrop-filter: blur(10px); color: #fff; display: grid; place-content: center; }
.sh-img .chip { position: absolute; left: 16px; top: 16px; }
.sh-body { padding: 0 20px; display: grid; gap: 18px; margin-top: -26px; position: relative; }
.sh-body h2 { font: 800 2rem/1.02 var(--f-display); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.grid-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gf { background: var(--surface); border-radius: var(--r-sm); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; }
.gf svg { grid-row: span 2; color: var(--slot); margin-top: 2px; }
.gf b { font-size: .92rem; font-weight: 600; line-height: 1.3; }
.gf span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.why { margin: 0; font-size: 1.02rem; line-height: 1.6; }
.doit { border-radius: var(--r-md); padding: 14px 16px; background: color-mix(in srgb, var(--slot) 16%, var(--surface)); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.doit svg { color: var(--slot); margin-top: 2px; }
.doit b { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--slot); margin-bottom: 2px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; font-size: 1rem; transition: transform .2s var(--ease); }
.cta:active { transform: scale(.98); }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: var(--r-md); background: var(--surface); font-size: .8rem; font-weight: 600; text-decoration: none; transition: transform .2s var(--ease); }
.tool:active { transform: scale(.96); }
.tool svg { width: 22px; height: 22px; }
.status { display: grid; gap: 10px; }
.status .lbl { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { height: 44px; border-radius: 999px; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s, color .2s; }
.seg button.on { background: var(--slot); color: #fff; }
.seg button[data-s="done"].on { background: var(--good); color: #062018; }
.faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.faces button { background: var(--surface); border-radius: var(--r-md); padding: 10px 4px; display: grid; justify-items: center; gap: 2px; font-size: .8rem; color: var(--muted); transition: transform .2s var(--ease); }
.faces button span { font-size: 1.7rem; line-height: 1.2; filter: grayscale(1); opacity: .6; transition: filter .2s, opacity .2s, transform .3s var(--ease); }
.faces button.on { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.faces button.on span { filter: none; opacity: 1; transform: scale(1.15); }

/* ---------- Setup ---------- */
.setup { background: var(--surface); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 20px; max-width: 560px; }
.setup ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; counter-reset: s; }
.setup li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; counter-increment: s; }
.setup li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-content: center; font-weight: 700; }
.setup li span { display: block; color: var(--muted); font-size: .9rem; }
.setup code { font-size: .85em; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
.field input { width: 100%; margin-top: 10px; border: 0; border-radius: var(--r-sm); padding: 14px; font: inherit; background: var(--surface-2); color: var(--ink); }
.msg { font-size: .88rem; margin: 6px 0 0; min-height: 1.2em; color: var(--muted); }
.msg.bad { color: var(--accent); }
.link { color: var(--accent); font-weight: 600; display: inline-block; margin-top: 6px; }

/* ---------- Toast, motion ---------- */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 24px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: .9rem; font-weight: 600; transition: .3s var(--ease); pointer-events: none;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.rise { animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.skel { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand">Life <i></i></div>
  <button class="gen" id="gen" hidden><svg class="i"><use href="#i-refresh"/></svg><span>New week</span></button>
</div></header>

<div class="wrap">
  <section class="hero">
    <div>
      <p class="kicker" id="kicker">Eindhoven</p>
      <h1 id="title">Your week.</h1>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (name, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const SLOTS = { social: "Meet people", out: "Going out", food: "Food", learn: "Learn", trip: "Day trip", stretch: "Stretch" };
const slotOf = c => SLOTS[c.slot] ? c.slot : "stretch";
const MODES = { walk: "Walk", bike: "Bike", train: "Train" };
const FACES = [["1", "😐", "Meh"], ["2", "🙂", "Good"], ["3", "🤩", "Loved it"]];
const CENTRE = [51.4433, 5.4797];  // Eindhoven Centraal: travel times are from here
const BUDGET = 30;
let briefs = [], ledger = {}, current = null, weather = {}, selDay = null, sheetId = null, map = null;

function toast(msg, ic) {
  const t = $("toast"); t.innerHTML = (ic ? icon(ic) : "") + esc(msg); t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2300);
}
const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} };

// ---------- Dates ----------
const dayKey = d => d.toLocaleDateString("sv");
const parseStart = s => s ? new Date(s.length === 16 ? s + ":00" : s) : null;
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
const fmtTime = d => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const whenShort = c => { const d = parseStart(c.start); return d ? `${fmt(d, { weekday: "short" })} ${d.getDate()} · ${fmtTime(d)}` : ""; };
const fmtDate = d => fmt(new Date(d + "T12:00"), { day: "numeric", month: "long" });
const euro = n => n === 0 ? "Free" : n == null ? "€ ?" : "€" + (Number.isInteger(n) ? n : n.toFixed(2));

// ---------- Weather: Open-Meteo, no key, Eindhoven ----------
const WX = c => c === 0 ? ["sun", "Sunny"] : c <= 2 ? ["partly", "Partly sunny"] : c === 3 ? ["cloud", "Cloudy"] : c <= 48 ? ["fog", "Fog"]
  : c <= 67 || (c >= 80 && c <= 82) ? ["rain", "Rain"] : c <= 77 || c === 85 || c === 86 ? ["snow", "Snow"] : ["storm", "Storms"];
async function loadWeather() {
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=51.44&longitude=5.48&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FAmsterdam&forecast_days=14");
    const d = (await r.json()).daily;
    d.time.forEach((t, i) => weather[t] = { code: d.weather_code[i], max: Math.round(d.temperature_2m_max[i]), rain: d.precipitation_probability_max[i] });
    if (briefs.length) render();
  } catch (_) {}
}

// ---------- GitHub backend: the private repo holds briefs and ledger.md ----------
const GH = { repo: "jerichoNega/life", branch: "master", workflow: "life.yml" };
let token = null;
try { token = localStorage.getItem("life.token"); } catch (e) {}

async function gh(path, { method = "GET", body, raw } = {}) {
  const r = await fetch(`https://api.github.com/repos/${GH.repo}${path}`, {
    method, cache: "no-store",
    headers: { Authorization: "Bearer " + token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body && JSON.stringify(body),
  });
  if (r.status === 401) { forgetToken(); throw Object.assign(new Error("bad token"), { status: 401 }); }
  if (!r.ok) throw Object.assign(new Error(r.status), { status: r.status });
  return r.status === 204 ? null : raw ? r.text() : r.json();
}
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const b64encode = s => { let out = ""; for (const b of new TextEncoder().encode(s)) out += String.fromCharCode(b); return btoa(out); };

// ledger.md: | Added | Item | Area | Status | Rating | Note |
const ROW = /^\|\s*(\d{4}-\d{2}-\d{2})\s*\|(.*)\|\s*$/;
const COLS = 6;
function ledgerRows(text) {
  return text.split("\n").map((line, i) => {
    const m = line.match(ROW);
    const cells = m && [m[1], ...m[2].split("|").map(c => c.trim())];
    return cells && cells.length >= 4 && cells.length <= COLS ? { i, cells: [...cells, ...Array(COLS - cells.length).fill("")] } : null;
  }).filter(Boolean);
}
function cardOf(id) {
  for (const b of briefs) for (const c of b.cards || []) if (c.id === id) return { added: b.date, c };
  return null;
}
function ledgerFrom(text) {
  const out = {};
  for (const { cells: [added, name, area, status, rating, note] } of ledgerRows(text))
    for (const b of briefs) if (b.date === added) for (const c of b.cards || []) if (c.name === name)
      out[c.id] = { added, status, rating, note };
  return out;
}
function patchLedger(text, id, patch) {
  const { added, c } = cardOf(id);
  const lines = text.replace(/\n$/, "").split("\n");
  const hit = ledgerRows(text).find(r => r.cells[0] === added && r.cells[1] === c.name);
  const cells = hit ? hit.cells : [added, c.name, c.slot, "open", "", ""];
  if (patch.status) { cells[3] = patch.status; if (patch.status !== "done") cells[4] = ""; }
  if ("rating" in patch) cells[4] = patch.rating;
  const row = "| " + cells.join(" | ") + " |";
  hit ? (lines[hit.i] = row) : lines.push(row);
  return lines.join("\n") + "\n";
}
const backend = {
  async briefs() {
    const files = (await gh(`/contents/briefs?ref=${GH.branch}`)).filter(f => f.name.endsWith(".json"));
    const all = await Promise.all(files.map(f => gh(`/contents/${f.path}?ref=${GH.branch}`, { raw: true }).then(JSON.parse).catch(() => null)));
    return all.filter(Boolean).sort((a, z) => z.date.localeCompare(a.date));
  },
  async ledger() { return ledgerFrom(await gh(`/contents/ledger.md?ref=${GH.branch}`, { raw: true })); },
  async save(id, patch) {
    for (let attempt = 0; ; attempt++) {
      const f = await gh(`/contents/ledger.md?ref=${GH.branch}`);
      const text = patchLedger(b64decode(f.content), id, patch);
      try {
        await gh("/contents/ledger.md", { method: "PUT", body: {
          message: `ledger: ${cardOf(id).c.name} ${patch.status || "rating " + patch.rating}`, content: b64encode(text), sha: f.sha, branch: GH.branch } });
        return ledgerFrom(text);
      } catch (e) { if (e.status !== 409 || attempt) throw e; }  // written in between: reread once
    }
  },
};

// ---------- Render ----------
const stOf = id => (ledger[id] || {}).status || "open";
const brief = () => briefs.find(x => x.date === current) || briefs[0];
const img = (src, alt = "") => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";

function ring(cards) {
  const n = cards.length || 1, r = 40, C = 2 * Math.PI * r, gap = 4, seg = C / n - gap;
  const arcs = cards.map((c, i) => {
    const on = stOf(c.id) === "done";
    return `<circle cx="46" cy="46" r="${r}" fill="none" stroke-width="9" stroke-linecap="round" stroke="${on ? `var(--${slotOf(c)})` : "var(--surface-2)"}"
      stroke-dasharray="${Math.max(seg, 1)} ${C}" stroke-dashoffset="${-(i * (seg + gap))}"/>`;
  }).join("");
  const done = cards.filter(c => stOf(c.id) === "done").length;
  return `<svg viewBox="0 0 92 92">${arcs}</svg><b>${done}<small>of ${cards.length} done</small></b>`;
}

function dayStrip(b) {
  const start = new Date(); start.setHours(12, 0, 0, 0);
  const items = [...(b.cards || []).map(c => ({ c, card: true })), ...(b.also || []).map(c => ({ c }))];
  let out = "";
  for (let k = 0; k < 7; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    const key = dayKey(d), w = weather[key];
    const on = items.filter(x => { const s = parseStart(x.c.start); return s && dayKey(s) === key; });
    const pips = on.filter(x => x.card).map(x => `<i style="background:var(--${slotOf(x.c)})"></i>`).join("") + on.filter(x => !x.card).map(() => `<i class="also"></i>`).join("");
    const [wi, wl] = w ? WX(w.code) : [null, ""];
    out += `<button class="day ${k === 0 ? "today" : ""} ${selDay === key ? "sel" : ""} ${on.length ? "" : "empty"}" data-day="${key}" aria-pressed="${selDay === key}"
      aria-label="${esc(fmt(d, { weekday: "long", day: "numeric", month: "long" }))}${w ? `, ${wl}, ${w.max} degrees` : ""}, ${on.length} plans">
      <span class="dn">${k === 0 ? "Today" : fmt(d, { weekday: "short" })}</span><span class="dd">${d.getDate()}</span>
      <span class="wx">${w ? icon(wi) + `${w.max}°` : `<span style="height:34px"></span>`}</span>
      <span class="pips">${pips}</span></button>`;
  }
  return `<div class="days">${out}</div>`;
}

function cardHTML(c, i) {
  const st = stOf(c.id), s = slotOf(c), d = parseStart(c.start);
  const dim = selDay && !(d && dayKey(d) === selDay);
  return `<button class="card s-${st} ${dim ? "dim" : ""} rise" style="--slot:var(--${s});animation-delay:${i * 70}ms" data-open="${esc(c.id)}" aria-label="${esc(c.name)}, ${esc(SLOTS[s])}">
    ${icon(s, "i glyph")}${img(c.image, c.name)}
    <div class="top"><span class="chip"><i></i>${esc(SLOTS[s])}</span>
      ${st === "done" ? `<span class="badge done">${icon("check")}</span>` : st === "later" ? `<span class="badge">${icon("later")}</span>` : st === "skipped" ? `<span class="badge">${icon("skip")}</span>` : ""}</div>
    <div class="bottom">
      <div class="when">${esc(whenShort(c) || c.when)}</div>
      <h3>${esc(c.name)}</h3>
      <div class="facts-row">
        <span class="fact">${icon("euro")}${esc(euro(c.price_eur))}</span>
        ${c.minutes ? `<span class="fact">${icon(c.mode in MODES ? c.mode : "pin")}${c.minutes} min</span>` : ""}
        ${c.place ? `<span class="fact">${icon("pin")}${esc(c.place)}</span>` : ""}
      </div>
    </div></button>`;
}

function bento(b) {
  const cards = b.cards || [];
  const known = cards.filter(c => typeof c.price_eur === "number");
  const spent = known.reduce((a, c) => a + c.price_eur, 0), unknown = cards.length - known.length;
  const bars = known.filter(c => c.price_eur > 0).map(c => `<i style="--slot:var(--${slotOf(c)});width:${Math.min(100, c.price_eur / Math.max(BUDGET, spent) * 100)}%" title="${esc(c.name)}"></i>`).join("");
  const mins = cards.reduce((a, c) => a + (c.minutes || 0), 0);
  const modes = Object.keys(MODES).map(m => [m, cards.filter(c => c.mode === m).length]).filter(([, n]) => n);
  // all-time: what got done, by slot, and done per week for the last 8 briefs
  const allDone = briefs.flatMap(w => (w.cards || []).filter(c => stOf(c.id) === "done"));
  const bySlot = Object.keys(SLOTS).map(s => [s, allDone.filter(c => slotOf(c) === s).length]);
  const weeks = briefs.slice(0, 8).reverse().map(w => (w.cards || []).filter(c => stOf(c.id) === "done").length);
  const maxW = Math.max(1, ...weeks);
  return `<div class="bento">
    <div class="tile"><div class="lbl">${icon("wallet")}Budget</div>
      <div class="big">${euro(spent).replace("Free", "€0")}<small style="display:block;margin-top:4px">of €${BUDGET} this week</small></div>
      <div class="meter">${bars}</div>
      <div class="note">${spent <= BUDGET ? `€${(BUDGET - spent).toFixed(2).replace(".00", "")} left` : "Over budget, pick one"}${unknown ? ` · ${unknown} price${unknown > 1 ? "s" : ""} unknown` : ""}</div></div>
    <div class="tile"><div class="lbl">${icon("route")}Getting around</div>
      <div class="big">${mins} min<small style="display:block;margin-top:4px">travel, all plans</small></div>
      <div class="modes">${modes.map(([m, n]) => `<span class="mode">${icon(m)}${n}× ${MODES[m].toLowerCase()}</span>`).join("")}</div></div>
    <div class="tile"><div class="lbl">${icon("grid")}${allDone.length ? "Your mix" : "This week's mix"}</div>
      <div class="big">${allDone.length || cards.length}<small style="display:block;margin-top:4px">${allDone.length ? "plans done so far" : "kinds of plans"}</small></div>
      <div class="mix">${(allDone.length ? bySlot.filter(([, n]) => n) : Object.keys(SLOTS).map(s => [s, cards.filter(c => slotOf(c) === s).length]).filter(([, n]) => n))
        .map(([s, n]) => `<span class="on" style="--slot:var(--${s})"><i></i>${SLOTS[s]}${n > 1 ? " ×" + n : ""}</span>`).join("")}</div></div>
    <div class="tile"><div class="lbl">${icon("spark")}Weeks</div>
      <div class="big">${weeks.filter(Boolean).length}<small style="display:block;margin-top:4px">active week${weeks.filter(Boolean).length === 1 ? "" : "s"}</small></div>
      <div class="spark">${weeks.map(n => `<i class="${n ? "on" : ""}" style="height:${Math.max(10, n / maxW * 100)}%"></i>`).join("")}</div>
      <div class="note">${allDone.length ? "Plans done per week" : "Do one plan to start your streak"}</div></div>
  </div>`;
}

function alsoHTML(b) {
  const also = b.also || [];
  if (!also.length) return "";
  return `<div class="sec"><h2>Also on</h2><span>if a plan doesn't fit</span></div><div class="also">${also.map(a => {
    const d = parseStart(a.start);
    return `<a class="row" href="${esc(a.url)}" target="_blank" rel="noopener">
      <span class="thumb" style="${a.image ? `background-image:url('${esc(a.image).replace(/'/g, "%27")}')` : ""}">${a.image ? "" : icon("pin")}</span>
      <span><b>${esc(a.label)}</b><span>${esc(a.note)}</span></span>
      ${d ? `<span class="dchip">${esc(fmt(d, { weekday: "short" }))}<small>${d.getDate()} ${esc(fmt(d, { month: "short" }))}</small></span>` : "<span></span>"}</a>`;
  }).join("")}</div>`;
}

function render() {
  if (!briefs.length) {
    $("title").innerHTML = "Nothing yet.";
    $("sub").textContent = "Your first week lands on Thursday night. Or tap New week.";
    $("main").innerHTML = ""; return;
  }
  const b = brief(); current = b.date;
  const cards = b.cards || [], latest = b === briefs[0];
  const done = cards.filter(c => stOf(c.id) === "done").length;
  $("kicker").textContent = `Eindhoven · week of ${fmtDate(b.date)}`;
  $("title").innerHTML = !latest ? `Week of <em>${esc(fmtDate(b.date))}</em>.` : done === cards.length ? `All done. <em>Legend.</em>` : done ? `${done} down, <em>${cards.length - done} to go.</em>` : `${cards.length} plans. <em>Go live a little.</em>`;
  $("sub").textContent = latest ? (done ? "Keep it going. Tap a plan for the details." : "Tap a plan to see it, book it, or bring a friend.") : "A past week. Tap a plan to update it.";
  $("ring").hidden = false; $("ring").innerHTML = ring(cards);

  $("main").innerHTML = `
    ${latest ? dayStrip(b) : ""}
    <div class="sec" style="margin-top:${latest ? 8 : 0}px"><h2>This week</h2>${selDay ? `<button data-day="${selDay}">Show all</button>` : `<span>${cards.length} picks for you</span>`}</div>
    <div class="deck" id="deck">${cards.map(cardHTML).join("")}</div>
    <div class="sec"><h2>At a glance</h2></div>
    ${bento(b)}
    <div class="sec"><h2>On the map</h2><span>from Eindhoven Centraal</span></div>
    <div class="map" id="map"></div>
    ${alsoHTML(b)}
    ${briefs.length > 1 ? `<div class="sec"><h2>Past weeks</h2></div><div class="weeks">${briefs.map(w => {
      const n = (w.cards || []).filter(c => stOf(c.id) === "done").length;
      return `<button data-week="${esc(w.date)}" class="${w.date === current ? "on" : ""}">${esc(fmtDate(w.date))}<small>${n} of ${(w.cards || []).length} done</small></button>`;
    }).join("")}</div>` : ""}`;
  drawMap(b);
  if (sheetId) fillSheet(sheetId);
}

// ---------- Map: Leaflet + Esri tiles, pins in slot colours ----------
function drawMap(b) {
  if (!window.L) return;
  if (map) { map.remove(); map = null; }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  map = L.map("map", { zoomControl: false, attributionControl: true, scrollWheelZoom: false, tap: true });
  // Esri canvas tiles: no key needed, calm grey base so the slot-coloured pins carry the colour
  L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
    maxZoom: 16, attribution: "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors" }).addTo(map);
  const pts = [CENTRE];
  L.marker(CENTRE, { icon: L.divIcon({ className: "", html: '<div class="pin-you"></div>', iconSize: [16, 16] }), keyboard: false }).addTo(map).bindTooltip("Eindhoven Centraal", { direction: "top", offset: [0, -10] });
  (b.also || []).forEach(a => {
    if (a.lat == null) return;
    pts.push([a.lat, a.lng]);
    L.marker([a.lat, a.lng], { icon: L.divIcon({ className: "", html: '<div class="pin-also"></div>', iconSize: [12, 12] }) }).addTo(map)
      .bindTooltip(a.label, { direction: "top", offset: [0, -8] }).on("click", () => window.open(a.url, "_blank", "noopener"));
  });
  (b.cards || []).forEach((c, i) => {
    if (c.lat == null) return;
    pts.push([c.lat, c.lng]);
    L.marker([c.lat, c.lng], { icon: L.divIcon({ className: "", html: `<div class="pin ${stOf(c.id) === "done" ? "done" : ""}" style="--slot:var(--${slotOf(c)})"><b>${i + 1}</b></div>`, iconSize: [34, 34], iconAnchor: [17, 34] }), riseOnHover: true })
      .addTo(map).bindTooltip(c.place || c.name, { direction: "top", offset: [0, -36] }).on("click", () => openSheet(c.id));
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.18), { maxZoom: 15 });
}

// ---------- Sheet ----------
function ics(c) {
  const d = parseStart(c.start); if (!d) return null;
  const e = c.end ? parseStart(c.end) : new Date(d.getTime() + 2 * 3600e3);
  const f = x => `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, "0")}${String(x.getDate()).padStart(2, "0")}T${String(x.getHours()).padStart(2, "0")}${String(x.getMinutes()).padStart(2, "0")}00`;
  const t = s => String(s || "").replace(/[,;\\]/g, m => "\\" + m).replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//life//EN", "BEGIN:VEVENT", `UID:${c.id}@life`, `DTSTAMP:${f(new Date())}`,
    `DTSTART;TZID=Europe/Amsterdam:${f(d)}`, `DTEND;TZID=Europe/Amsterdam:${f(e)}`, `SUMMARY:${t(c.name)}`, `LOCATION:${t(c.where)}`,
    `DESCRIPTION:${t(c.do + "\n" + (c.link ? c.link.url : ""))}`, c.link ? `URL:${c.link.url}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
}
function directions(c) {
  const mode = { walk: "walking", bike: "bicycling", train: "transit" }[c.mode] || "bicycling";
  const dest = c.lat != null ? `${c.lat},${c.lng}` : c.where;
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=${mode}`;
}
function fillSheet(id) {
  const hit = cardOf(id); if (!hit) return;
  const c = hit.c, s = slotOf(c), st = stOf(id), r = (ledger[id] || {}).rating, d = parseStart(c.start);
  const w = d && weather[dayKey(d)];
  const sh = $("sheet");
  sh.style.setProperty("--slot", `var(--${s})`);
  sh.innerHTML = `
    <div class="sh-img">${icon(s, "i glyph")}${img(c.image, c.name)}<span class="grab" aria-hidden="true"></span>
      <span class="chip"><i></i>${esc(SLOTS[s])}</span><button class="x" data-close aria-label="Close">${icon("x")}</button></div>
    <div class="sh-body">
      <h2 id="sh-title">${esc(c.name)}</h2>
      <div class="grid-facts">
        <div class="gf">${icon("clock")}<b>${d ? esc(fmt(d, { weekday: "long", day: "numeric", month: "short" })) : "When it suits"}</b><span>${d ? esc(fmtTime(d)) + (c.end ? "–" + esc(fmtTime(parseStart(c.end))) : "") : esc(c.when)}</span></div>
        <div class="gf">${icon("pin")}<b>${esc(c.place || "Where")}</b><span>${esc(c.where)}</span></div>
        <div class="gf">${icon("euro")}<b>${esc(euro(c.price_eur))}</b><span>${esc(c.cost) === esc(euro(c.price_eur)) ? (c.price_eur ? "per person" : "") : esc(c.cost)}</span></div>
        <div class="gf">${icon(c.mode in MODES ? c.mode : "route")}<b>${c.minutes ? c.minutes + " min" : "Getting there"}${c.mode ? " · " + esc(MODES[c.mode] || c.mode) : ""}</b><span>${esc(c.travel)}</span></div>
        ${w ? `<div class="gf" style="grid-column:1/-1">${icon(WX(w.code)[0])}<b>${w.max}° · ${esc(WX(w.code)[1])}</b><span>${w.rain}% chance of rain that day</span></div>` : ""}
      </div>
      <p class="why">${esc(c.why)}</p>
      <div class="doit">${icon("check")}<div><b>Do it</b>${esc(c.do)}</div></div>
      ${c.link && c.link.url ? `<a class="cta" href="${esc(c.link.url)}" target="_blank" rel="noopener">Open and book ${icon("arrow")}</a>` : ""}
      <div class="tools">
        <a class="tool" href="${esc(directions(c))}" target="_blank" rel="noopener">${icon("route")}Directions</a>
        <button class="tool" data-ics="${esc(id)}" ${d ? "" : "disabled"}>${icon("cal")}Calendar</button>
        <button class="tool" data-share="${esc(id)}">${icon("share")}Invite</button>
      </div>
      <div class="status"><span class="lbl">Did you go?</span>
        <div class="seg" role="group" aria-label="Status">
          ${[["done", "check", "Did it"], ["later", "later", "Later"], ["skipped", "skip", "Skip"]].map(([k, ic, l]) =>
            `<button data-s="${k}" class="${st === k ? "on" : ""}" aria-pressed="${st === k}">${icon(ic)}${l}</button>`).join("")}
        </div>
        ${st === "done" ? `<span class="lbl">How was it?</span><div class="faces">${FACES.map(([v, e, l]) =>
          `<button data-r="${v}" class="${r === v ? "on" : ""}" aria-pressed="${r === v}"><span>${e}</span>${l}</button>`).join("")}</div>` : ""}
      </div>
    </div>`;
}
function openSheet(id) {
  sheetId = id; fillSheet(id);
  const sh = $("sheet"), sc = $("scrim");
  sh.hidden = sc.hidden = false; document.body.classList.add("locked");
  requestAnimationFrame(() => { sh.classList.add("show"); sc.classList.add("show"); });
  sh.scrollTop = 0;
  if (location.hash !== "#plan") history.pushState({ sheet: 1 }, "", "#plan");
  setTimeout(() => { const x = sh.querySelector(".x"); x && x.focus({ preventScroll: true }); }, 50);
}
function closeSheet(fromPop) {
  if (!sheetId) return;
  const sh = $("sheet"), sc = $("scrim"), id = sheetId;
  sheetId = null; sh.classList.remove("show"); sc.classList.remove("show"); document.body.classList.remove("locked");
  sh.style.transform = "";
  setTimeout(() => { if (!sheetId) { sh.hidden = sc.hidden = true; } }, 450);
  if (!fromPop && location.hash === "#plan") history.back();
  const card = document.querySelector(`[data-open="${CSS.escape(id)}"]`); card && card.focus({ preventScroll: true });
}
addEventListener("popstate", () => closeSheet(true));
// Drag the photo down to close, like a native sheet
(() => {
  let y0 = null, dy = 0;
  const sh = $("sheet");
  sh.addEventListener("touchstart", e => { if (sh.scrollTop <= 0 && e.target.closest(".sh-img")) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = "none"; } }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener("touchend", () => { if (y0 == null) return; sh.style.transition = ""; y0 = null; dy > 110 ? closeSheet() : (sh.style.transform = ""); });
})();

// ---------- Saving ----------
async function save(id, patch) {
  const before = ledger[id];
  ledger[id] = { ...(before || {}), ...patch, ...(patch.status && patch.status !== "done" ? { rating: "" } : {}) };
  haptic(); render();  // show it straight away, then write to GitHub
  if (patch.status === "done") toast("Nice. How was it?", "check");
  try {
    ledger = await backend.save(id, patch);
    render();
    if (patch.status === "later") toast("Saved for later", "later");
    else if (patch.status === "skipped") toast("Skipped. Next week gets better.", "skip");
    else if (patch.rating) toast(patch.rating === "3" ? "Noted. More like this." : "Thanks, noted", "check");
  } catch (e) {
    ledger[id] = before; render();
    toast("Could not save. Check the connection.");
  }
}

async function load() {
  briefs = await backend.briefs();
  try { current = localStorage.getItem("life.week"); } catch (_) {}
  if (!briefs.some(b => b.date === current)) current = null;
  ledger = await backend.ledger();
  render();
}

// ---------- New week: start the workflow, poll until it finishes ----------
let dispatchedAt = 0, wasRunning = false;
async function runState() {
  const run = (await gh(`/actions/workflows/${GH.workflow}/runs?per_page=1`)).workflow_runs[0];
  // A dispatched run takes a few seconds to show up in the list
  if (dispatchedAt && Date.now() - dispatchedAt < 90000 && (!run || Date.parse(run.created_at) < dispatchedAt - 5000)) return { running: true };
  if (!run) return { running: false };
  const done = run.status === "completed";
  return { running: !done, failed: done && run.conclusion !== "success" };
}
async function poll() {
  let st;
  try { st = await runState(); } catch (e) { return (poll.t = setTimeout(poll, 30000)); }
  const g = $("gen");
  g.disabled = st.running; g.classList.toggle("busy", st.running);
  g.querySelector("span").textContent = st.running ? "Finding plans…" : "New week";
  $("run").textContent = st.running ? "Scanning Eindhoven for you. Takes 5 to 15 minutes." : st.failed ? "The last search failed. See the Actions tab on GitHub." : "";
  if (!st.running && wasRunning) { await load(); toast("Your new week is ready", "check"); }
  wasRunning = st.running;
  poll.t = setTimeout(poll, st.running ? 10000 : 60000);
}
$("gen").addEventListener("click", async () => {
  $("gen").disabled = true;
  try { await gh(`/actions/workflows/${GH.workflow}/dispatches`, { method: "POST", body: { ref: GH.branch } }); dispatchedAt = Date.now(); }
  catch (e) { toast("Could not start the search"); }
  clearTimeout(poll.t); poll();
});

// ---------- Events ----------
document.addEventListener("click", async e => {
  if (e.target.closest("[data-close]") || e.target === $("scrim")) return closeSheet();
  const o = e.target.closest("[data-open]");
  if (o) return openSheet(o.dataset.open);
  const dy = e.target.closest("[data-day]");
  if (dy) {
    selDay = selDay === dy.dataset.day ? null : dy.dataset.day; render();
    const first = document.querySelector(".card:not(.dim)"); first && first.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
    return;
  }
  const w = e.target.closest("[data-week]");
  if (w) { current = w.dataset.week; selDay = null; try { localStorage.setItem("life.week", current); } catch (_) {} render(); scrollTo({ top: 0, behavior: "smooth" }); return; }
  const s = e.target.closest("[data-s]");
  if (s && sheetId) return save(sheetId, { status: stOf(sheetId) === s.dataset.s ? "open" : s.dataset.s });  // tap again to undo
  const r = e.target.closest("[data-r]");
  if (r && sheetId) return save(sheetId, { rating: r.dataset.r });
  const ic = e.target.closest("[data-ics]");
  if (ic) {
    const c = cardOf(ic.dataset.ics).c, text = ics(c);
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "text/calendar" })), download: c.id + ".ics" });
    document.body.append(a); a.click(); a.remove();
    return toast("Added to your calendar", "cal");
  }
  const sh = e.target.closest("[data-share]");
  if (sh) {
    const c = cardOf(sh.dataset.share).c, d = parseStart(c.start);
    const text = `Want to come? ${c.name}${d ? ", " + fmt(d, { weekday: "long", day: "numeric", month: "short" }) + " " + fmtTime(d) : ""} at ${c.place || c.where}.`;
    const url = c.link ? c.link.url : location.href;
    try {
      if (navigator.share) await navigator.share({ title: c.name, text, url });
      else { await navigator.clipboard.writeText(text + " " + url); toast("Invite copied", "share"); }
    } catch (_) {}
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => briefs.length && render());

// ---------- Connect this device: a fine-grained GitHub key, stored on the device ----------
function forgetToken() {
  token = null;
  try { localStorage.removeItem("life.token"); } catch (e) {}
  askToken("expired");
}
function deviceName() {
  const ua = navigator.userAgent, app = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const kind = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : "browser";
  return `Life · ${kind}${app ? " app" : ""}`;
}
function tokenUrl() {
  const q = new URLSearchParams({ name: deviceName(), description: "Life app: read the week, save what you did, start New week.",
    target_name: GH.repo.split("/")[0], expires_in: "366", contents: "write", actions: "write" });
  return "https://github.com/settings/personal-access-tokens/new?" + q;
}
function askToken(reason) {
  clearTimeout(poll.t);
  $("gen").hidden = true; $("ring").hidden = true;
  $("kicker").textContent = reason === "expired" ? "Reconnect" : "Setup · about 1 minute";
  $("title").innerHTML = reason === "expired" ? "Your key <em>expired.</em>" : "Let's get you <em>connected.</em>";
  $("sub").textContent = reason === "expired" ? "GitHub keys expire. Make a fresh one and you're back." : "Your weeks live in your private GitHub repo. A key lets this device read them.";
  $("main").innerHTML = `<form class="setup rise" id="token-form" novalidate>
    <ol>
      <li><div><b>Make a key on GitHub</b><span>Everything is filled in except one thing: under <em>Repository access</em>, choose <em>Only select repositories</em> and pick <code>${esc(GH.repo.split("/")[1])}</code>.</span>
        <a class="link" href="${esc(tokenUrl())}" target="_blank" rel="noopener">Open GitHub ↗</a></div></li>
      <li><div><b>Generate and copy it</b><span>It starts with <code>github_pat_</code>.</span></div></li>
      <li><div><b>Paste it here</b><span>It stays on this device.</span>
        <div class="field"><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="GitHub key"></div>
        <p class="msg" id="token-msg" role="status"></p></div></li>
    </ol>
    <button type="submit" class="cta" id="token-save">Connect</button>
  </form>`;
  const input = $("token"), msg = $("token-msg");
  const say = (text, ok) => { msg.textContent = text; msg.className = "msg" + (ok || !text ? "" : " bad"); };
  $("token-form").addEventListener("submit", async e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!/^(github_pat_|ghp_)/.test(t)) return say("That doesn't look like a GitHub key. It should start with github_pat_.");
    $("token-save").disabled = true; say("Checking with GitHub…", true);
    // Test the key before keeping it, so a typo never gets saved
    try {
      const r = await fetch(`https://api.github.com/repos/${GH.repo}`, { cache: "no-store", headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } });
      if (r.status === 401) throw new Error("GitHub doesn't accept that key. Copy it again, the whole thing.");
      if (r.status === 404 || r.status === 403) throw new Error("The key works but can't see the life repo. Edit it on GitHub and add that repository.");
      if (!r.ok) throw new Error("GitHub didn't answer. Try again in a moment.");
    } catch (err) {
      $("token-save").disabled = false;
      return say(err instanceof TypeError ? "No connection. Check your internet and try again." : err.message);
    }
    token = t;
    try { localStorage.setItem("life.token", token); } catch (_) {}
    toast("Connected", "check");
    start();
  });
}

function start() {
  if (!token) return askToken();
  $("gen").hidden = false;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  loadWeather();
  load().catch(e => { if (e.status !== 401) $("sub").textContent = "Could not load your week. Check the connection."; });
  poll();
}
start();
</script>
</html>
